<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>여행 코스 플래너 · 카카오맵 · 실데이터</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e8ecf3;--muted:#9aa4b2;--accent:#4f8cff;--gas:#22c55e;--food:#f97316;--stay:#a855f7;--gold:#eab308}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  #app{display:grid;grid-template-columns:400px 1fr;height:100vh}
  @media (max-width:860px){
    #app{grid-template-columns:1fr;grid-template-rows:20vh auto;height:auto;min-height:100vh}
    main{order:-1;position:sticky;top:0;height:20vh;z-index:1}
    main.big{height:65vh}#app:has(main.big){grid-template-rows:65vh auto}
    #sidebar{overflow:visible}.scroll{overflow:visible;flex:none}
  }
  #sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  header{padding:13px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px;font-weight:700}
  header p{margin:3px 0 0;font-size:11px;color:var(--muted)}
  .scroll{overflow-y:auto;padding:12px 14px;flex:1}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:13px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  button.primary{width:100%;padding:11px;background:var(--accent);border:0;border-radius:9px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:2px}
  button.primary:disabled{opacity:.5}
  .status{font-size:11px;color:var(--muted);margin:8px 0;min-height:14px}
  .summary{display:flex;gap:8px;margin:10px 0}
  .summary .box{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center}
  .summary .box b{display:block;font-size:15px}.summary .box span{font-size:10px;color:var(--muted)}
  .navbtns{display:flex;gap:6px;margin:8px 0}
  .navbtns button{flex:1;padding:8px 4px;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer}
  /* 섹션 아코디언 */
  .sec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel2)}
  .sec>.sh{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-weight:700;font-size:13px;user-select:none}
  .sec>.sh .cnt{margin-left:auto;font-size:10px;color:var(--muted);font-weight:400}
  .sec>.sb{display:none;padding:4px 8px 8px}
  .sec.open>.sb{display:block}
  .sec>.sh .arw{transition:.15s;color:var(--muted)}
  .sec.open>.sh .arw{transform:rotate(90deg)}
  /* 기능 항목 */
  .feat{border:1px solid var(--line);border-radius:8px;margin:5px 0;background:var(--panel)}
  .feat>.fh{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;font-size:12.5px}
  .feat>.fh .star{cursor:pointer;font-size:14px;filter:grayscale(1);opacity:.5}
  .feat>.fh .star.on{filter:none;opacity:1}
  .feat>.fh .lock{font-size:10px;color:var(--gold);background:rgba(234,179,8,.12);padding:1px 6px;border-radius:10px}
  .feat>.fh .arw{margin-left:auto;color:var(--muted);transition:.15s}
  .feat.open>.fh .arw{transform:rotate(90deg)}
  .feat>.fb{display:none;padding:2px 10px 10px}
  .feat.open>.fb{display:block}
  /* 카드/위젯 */
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer;display:flex;gap:9px}
  .card:hover{border-color:var(--accent)}
  .card img{width:46px;height:46px;object-fit:cover;border-radius:6px;flex-shrink:0}
  .card .body{flex:1;min-width:0}
  .card .top{display:flex;justify-content:space-between;gap:8px}
  .card .name{font-weight:600;font-size:12.5px}
  .card .price{font-weight:700;font-size:13px;white-space:nowrap}
  .card .meta{font-size:10.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:20px;margin-right:4px}
  .b-cheap{background:var(--gas);color:#04210f;font-weight:700}
  .empty{color:var(--muted);font-size:11.5px;text-align:center;padding:14px 8px;line-height:1.6}
  .wt{font-size:11px;color:var(--muted);margin-bottom:6px}
  .big{font-size:20px;font-weight:700}.sub{font-size:11px;color:var(--muted);margin-top:2px}
  .fc-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .fc{flex:0 0 auto;text-align:center;font-size:10px;color:var(--muted)}
  .fc b{display:block;color:var(--text);font-size:12px}
  .fc img,.wx img{width:34px;height:34px;vertical-align:middle}
  .aqi-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-weight:700;font-size:12px}
  .trow{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}.trow:first-child{border-top:0}
  .gate-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .gate{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
  .dash{border:1px solid var(--accent);border-radius:10px;padding:10px;margin-bottom:10px;background:rgba(79,140,255,.06)}
  .dash .dh{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .dash .dh small{margin-left:auto;color:var(--muted);font-weight:400;font-size:10px}
  .dwrap{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;background:var(--panel2)}
  .dwrap .dt{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:5px}
  main{position:relative}
  #map{width:100%;height:100%}
  #mapFallback{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);flex-direction:column;gap:10px;text-align:center;padding:30px}
  details.keys{margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  details.keys summary{cursor:pointer;font-size:12px;color:var(--muted)}
  select.mini{width:100%;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:11.5px;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>🧭 여행 코스 플래너 <span style="font-size:10px;color:var(--gas)">● 실데이터</span></h1>
      <p>섹션별 메뉴 · ⭐로 내 대시보드 구성</p>
    </header>
    <div class="scroll">
      <div class="field" style="display:flex;justify-content:flex-end;margin-bottom:6px">
        <select id="lang" class="mini" style="width:auto;margin:0;padding:5px 8px">
          <option value="ko">🇰🇷 한국어</option><option value="en">🇺🇸 English</option><option value="ja">🇯🇵 日本語</option><option value="zh">🇨🇳 中文</option>
        </select>
      </div>
      <div class="field"><label data-i18n="origin">출발지</label><input id="origin" data-i18n-ph="originPh" placeholder="예: 서울역, 강남역, 우리집 주소" /></div>
      <div class="field"><label data-i18n="dests">목적지 (여러 곳 입력 시 최적 순서로 안내)</label>
        <div id="dests">
          <input class="dest" data-i18n-ph="destPh" placeholder="예: 부산 해운대" style="margin-bottom:6px" />
        </div>
        <button id="addDest" style="width:100%;padding:7px;background:var(--panel);border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer" data-i18n="addDest">＋ 목적지 추가</button>
      </div>
      <div class="row">
        <div class="field"><label>연료</label>
          <select id="fuel"><option value="B027">휘발유</option><option value="D047">경유</option><option value="K015">부탄(LPG)</option><option value="B034">고급휘발유</option></select>
        </div>
        <div class="field"><label>주유소 반경(m)</label><input id="radius" type="number" value="3000" /></div>
      </div>
      <button class="primary" id="go">경로·전체 정보 찾기</button>
      <div class="status" id="status"></div>

      <div class="summary" id="summary" style="display:none">
        <div class="box"><b id="sumDist">–</b><span id="sumDistL">거리</span></div>
        <div class="box"><b id="sumTime">–</b><span id="sumTimeL">시간</span></div>
        <div class="box"><b id="sumGas">–</b><span id="sumGasL">최저가</span></div>
      </div>
      <div id="navBox" style="display:none">
        <div id="navHint" class="sub" style="margin:6px 0 2px">🧭 목적지로 안내</div>
        <div class="navbtns" id="navRow">
          <button data-nav="kakaomap">카카오맵</button><button data-nav="kakaonavi">카카오내비</button><button data-nav="tmap">티맵</button><button data-nav="naver">네이버지도</button>
        </div>
      </div>

      <div class="dash" id="dash" style="display:none">
        <div class="dh" id="dashLabel">⭐ 내 대시보드 <small>메뉴에서 ⭐를 눌러 추가</small></div>
        <div id="dashBody"></div>
      </div>

      <div id="menu"></div>

      <details class="keys">
        <summary>⚙️ 카카오 키 설정</summary>
        <div class="field" style="margin-top:10px"><label>카카오 JavaScript 키</label><input id="k_kakao_js" placeholder="지도 표시용" /></div>
        <button class="primary" id="saveKeys">저장 & 지도 로드</button>
      </details>
    </div>
  </aside>
  <main>
    <button id="mapToggle" style="position:absolute;right:8px;top:8px;z-index:5;padding:5px 9px;font-size:11px;background:rgba(23,26,33,.9);color:#e8ecf3;border:1px solid #2a2f3a;border-radius:7px;cursor:pointer">⤢ 지도</button>
    <div id="map"><div id="mapFallback">🗺️ 카카오 지도<br><span style="font-size:12px">⚙️에서 카카오 JavaScript 키를 넣으면 지도·경로가 표시됩니다.</span></div></div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const store={get:(k,d='')=>localStorage.getItem('tcp_'+k)||d,set:(k,v)=>localStorage.setItem('tcp_'+k,v)};
let map,routeLine,markers=[],routePath=[],destLatLng=null,originLatLng=null,searched=false;
const data={};            // feature id -> results/html
let pins=JSON.parse(store.get('pins','[]'));

/* ---------- 기능 레지스트리 (섹션 → 하위 기능) ---------- */
const SECTIONS=[
  {id:'move',t:'🚗 이동·경로',feats:[
    {id:'transit',t:'대중교통 길찾기',kind:'widget',fn:'wTransit',ok:1},
    {id:'traffic',t:'실시간 교통량(정체)',kind:'widget',fn:'wTraffic',ok:1},
    {id:'restarea',t:'고속도로 휴게소 맛집',kind:'widget',fn:'wRestarea',ok:1},
    {id:'train',t:'열차 시간표',kind:'soon',ok:0},
    {id:'busterm',t:'시외·고속버스 터미널',kind:'soon',ok:0},
    {id:'ferry',t:'여객선 운항',kind:'soon',ok:0},
  ]},
  {id:'fuel',t:'⛽ 주유·충전',feats:[
    {id:'gas',t:'경로 최저가 주유소',kind:'gas',ok:1},
    {id:'gasavg',t:'유종별 전국 평균가',kind:'widget',fn:'wGasAvg',ok:1},
    {id:'evcharge',t:'전기차 충전소(최근접)',kind:'widget',fn:'wEv',ok:1},
    {id:'h2',t:'수소충전소 실시간',kind:'widget',fn:'wH2',ok:1},
    {id:'lpg',t:'LPG 충전소(최근접)',kind:'widget',fn:'wLpg',ok:1},
  ]},
  {id:'weather',t:'🌤️ 날씨·환경',feats:[
    {id:'weather',t:'현재 날씨',kind:'widget',fn:'wWeather',ok:1},
    {id:'forecast',t:'3시간 예보',kind:'widget',fn:'wForecast',ok:1},
    {id:'air',t:'대기질(미세먼지)',kind:'widget',fn:'wAir',ok:1},
    {id:'wxalert',t:'기상특보',kind:'widget',fn:'wWxalert',ok:1},
    {id:'beach',t:'해수욕장 날씨(수온·파고)',kind:'soon',ok:0},
    {id:'uv',t:'자외선 지수',kind:'soon',ok:0},
  ]},
  {id:'eat',t:'🍜 먹거리·숙소',feats:[
    {id:'food',t:'맛집',kind:'tour',ctid:39,ok:1},
    {id:'stay',t:'숙소',kind:'tour',ctid:32,ok:1},
  ]},
  {id:'play',t:'🎡 볼거리·체험',feats:[
    {id:'spot',t:'관광지',kind:'tour',ctid:12,ok:1},
    {id:'culture',t:'문화시설',kind:'tour',ctid:14,ok:1},
    {id:'festival',t:'축제·공연·행사',kind:'tour',ctid:15,ok:1},
    {id:'course',t:'추천 여행코스',kind:'tour',ctid:25,ok:1},
    {id:'leisure',t:'레포츠',kind:'tour',ctid:28,ok:1},
    {id:'shopping',t:'쇼핑',kind:'tour',ctid:38,ok:1},
    {id:'leisure2',t:'⛳ 골프장',kind:'widget',fn:'wGolf',ok:1},
    {id:'fishspot',t:'🎣 낚시터',kind:'widget',fn:'wFish',ok:1},
    {id:'camping',t:'🏕️ 캠핑장',kind:'widget',fn:'wCamping',ok:1},
    {id:'trail',t:'둘레길',kind:'soon',ok:0},
    {id:'pet',t:'반려동물 동반여행',kind:'soon',ok:0},
    {id:'barrier',t:'무장애 여행',kind:'soon',ok:0},
    {id:'market',t:'전통시장',kind:'soon',ok:0},
  ]},
  {id:'conv',t:'🚻 편의·안전',feats:[
    {id:'airport',t:'공항 혼잡도·리무진',kind:'airport',ok:1},
    {id:'toilet',t:'공중화장실',kind:'soon',ok:0},
    {id:'pharm',t:'약국',kind:'soon',ok:0},
    {id:'er',t:'응급실 실시간 병상',kind:'widget',fn:'wEr',ok:1},
    {id:'shelter',t:'대피소·쉼터',kind:'soon',ok:0},
  ]},
  {id:'etc',t:'💱 기타',feats:[
    {id:'fx',t:'환율',kind:'soon',ok:0},
    {id:'duty',t:'면세점',kind:'soon',ok:0},
  ]},
];
const FEAT={};SECTIONS.forEach(s=>s.feats.forEach(f=>{f.sec=s.id;FEAT[f.id]=f;}));

/* ---------- 메뉴 렌더 ---------- */
function buildMenu(){
  const openSec=JSON.parse(store.get('openSec','["fuel","eat"]'));
  $('#menu').innerHTML=SECTIONS.map(s=>{
    const okCnt=s.feats.filter(f=>f.ok).length;
    return `<div class="sec ${openSec.includes(s.id)?'open':''}" data-sec="${s.id}">
      <div class="sh"><span class="arw">▶</span>${tr('s_'+s.id)}<span class="cnt">${okCnt}/${s.feats.length} ${t('avail')}</span></div>
      <div class="sb">${s.feats.map(featRow).join('')}</div>
    </div>`;
  }).join('');
  bindMenu();
}
function featRow(f){
  const pinned=pins.includes(f.id);
  return `<div class="feat" data-feat="${f.id}">
    <div class="fh">
      <span class="star ${pinned?'on':''}" data-star="${f.id}">⭐</span>
      <span>${tr(f.id)}</span>
      ${f.ok?'':`<span class="lock">🔒 ${t('soon')}</span>`}
      <span class="arw">▶</span>
    </div>
    <div class="fb"><div class="cont" id="cont-${f.id}">${f.ok?`<div class="empty">${t('searchFirst')}</div>`:`<div class="empty">${t('comingSoon')}</div>`}</div></div>
  </div>`;
}
function bindMenu(){
  document.querySelectorAll('.sec>.sh').forEach(h=>h.onclick=()=>{
    const sec=h.parentElement;sec.classList.toggle('open');
    const open=[...document.querySelectorAll('.sec.open')].map(s=>s.dataset.sec);store.set('openSec',JSON.stringify(open));
  });
  document.querySelectorAll('.feat>.fh').forEach(h=>h.onclick=e=>{
    if(e.target.dataset.star)return;
    const f=h.parentElement;f.classList.toggle('open');
    const id=f.dataset.feat;if(f.classList.contains('open'))renderFeat(id,'cont-'+id);
  });
  document.querySelectorAll('.star').forEach(s=>s.onclick=e=>{
    e.stopPropagation();const id=s.dataset.star;
    if(pins.includes(id))pins=pins.filter(x=>x!==id);else pins.push(id);
    store.set('pins',JSON.stringify(pins));s.classList.toggle('on');renderDash();
  });
}
/* ---------- 대시보드(커스텀 프론트) ---------- */
function renderDash(){
  const d=$('#dash');
  if(!pins.length){d.style.display='none';return;}
  d.style.display='block';
  $('#dashBody').innerHTML=pins.map(id=>{
    const f=FEAT[id];if(!f)return '';
    return `<div class="dwrap"><div class="dt">${tr(id)}</div><div id="dash-${id}"></div></div>`;
  }).join('');
  pins.forEach(id=>renderFeat(id,'dash-'+id));
}

/* ---------- 카카오 지도 ---------- */
const DEFAULT_KAKAO_JS='498e6c86aec0d186027a9ab6c9d9e29c';
if(!store.get('kakao_js'))store.set('kakao_js',DEFAULT_KAKAO_JS);
$('#k_kakao_js').value=store.get('kakao_js');
$('#saveKeys').onclick=()=>{store.set('kakao_js',$('#k_kakao_js').value.trim());loadKakao();};
function loadKakao(){
  const key=store.get('kakao_js');if(!key)return setStatus('카카오 JS 키 없음');
  if(window.kakao?.maps)return initMap();
  const s=document.createElement('script');
  s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false`;
  s.onerror=()=>setStatus('⚠️ 지도 로드 실패 — 키/도메인 확인');
  s.onload=()=>kakao.maps.load(initMap);document.head.appendChild(s);
}
function initMap(){$('#map').innerHTML='';map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(36.5,127.8),level:13});setStatus('지도 준비 완료 ✅');}

/* ---------- 검색 실행 ---------- */
$('#go').onclick=run;
function currentPos(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,name:t('here')}),()=>res(null),{timeout:6000});
});}
async function run(){
  let o=$('#origin').value.trim();
  const destVals=[...document.querySelectorAll('.dest')].map(i=>i.value.trim()).filter(Boolean);
  if(!destVals.length)return setStatus(t('needDest'));
  $('#go').disabled=true;clearMap();setStatus(t('calc'));
  try{
    let O;
    if(o){O=await geocode(o);} else {O=await currentPos();if(!O)throw new Error(t('noGeo'));o=t('here');$('#origin').placeholder=t('here');}
    originLatLng={lat:O.lat,lng:O.lng};window.originName=o;
    const Ds=[];for(const dv of destVals){const D=await geocode(dv);Ds.push({...D,q:dv});}
    if(Ds.length>1){
      const stops=Ds.map(d=>`${d.lat},${d.lng},${encodeURIComponent(d.name||d.q)}`).join('|');
      const r=await fetch(`/api/route-multi?oLat=${O.lat}&oLng=${O.lng}&stops=${stops}`);const j=await r.json();
      if(!r.ok)throw new Error(j.error||'다중경로 실패');
      routePath=j.path||[];destLatLng={lat:j.dest.lat,lng:j.dest.lng};
      const fin=Ds.find(d=>Math.abs(d.lat-j.dest.lat)<1e-4)||Ds[Ds.length-1];window.destAddr=fin.addr||fin.q;window.destName=fin.q;

      window.__order=t('optOrder')+': '+o+' → '+j.order.map(x=>decodeURIComponent(x.name)).join(' → ');
    } else {
      const D=Ds[0];destLatLng={lat:D.lat,lng:D.lng};window.destAddr=D.addr||D.q;window.destName=D.q;window.__order=null;
      await route(O,D);
    }
    setStatus('전체 정보 조회 중…');
    // 사용가능한 모든 기능 로드
    const jobs=[loadGas()];
    SECTIONS.forEach(s=>s.feats.forEach(f=>{ if(f.ok&&f.kind==='tour')jobs.push(loadTour(f.id,f.ctid)); }));
    await Promise.all(jobs);

}
